name: Update Sunflower GDD

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Update GDD data
        run: npm run update:gdd
        env:
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}

      - name: Commit updated GDD data
        run: |
          git config user.name "gdd-bot"
          git config user.email "gdd-bot@users.noreply.github.com"
          git add src/_data/gdd_sunflowers.json
          git diff --cached --quiet || git commit -m "Update sunflower GDD data"
          git push

      - name: Build Eleventy site
        run: npm run build
